[workspace]
resolver = "2"
members = ["programs/*"]

[profile.test]
opt-level = 0

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# pyth-sdk-solana 0.10.6 from crates.io does not build with the Solana 4
# Pubkey. Use the same pyth-sdk-rs revision as jupiter-core-rs.
[patch.crates-io]
pyth-sdk = { git = "https://github.com/pyth-network/pyth-sdk-rs.git", rev = "3f7160bec935bf1698b20b1a3ecfa86b9eec6e1b" }
pyth-sdk-solana = { git = "https://github.com/pyth-network/pyth-sdk-rs.git", rev = "3f7160bec935bf1698b20b1a3ecfa86b9eec6e1b" }
